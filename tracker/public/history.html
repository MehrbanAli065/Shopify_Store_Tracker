<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>History — Shopify Tracker</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="bl">
      <a class="btn back" href="/" title="Back to all stores"><span class="ar">←</span> All stores</a>
      <div class="av" id="av" style="background:var(--blue)">··</div>
      <div style="min-width:0">
        <div class="ttl" id="nm">Loading…</div>
        <div class="sub" id="meta"></div>
      </div>
    </div>
    <div style="display:flex;gap:7px;align-items:center">
      <div class="seg">
        <a class="segb" id="tabReport">Report</a>
        <a class="segb on">History</a>
      </div>
      <button class="btn ico" id="tg" title="Switch theme">◐</button>
    </div>
  </div>
</header>

<div class="page">

  <div class="note" style="margin-top:0">
    <b>This is the archive.</b> Once a CSV has been ingested it can be deleted from Drive —
    every day's file is rebuilt here from the database, exactly as it was on that date.
  </div>

  <h2 style="margin-top:22px">Archived days</h2>
  <div id="daylist" class="daylist"><div class="spin">loading…</div></div>

  <div id="detail" hidden>
    <div class="snaphead">
      <div>
        <h2 style="margin:0">Catalogue on <span id="dLabel">…</span></h2>
        <div class="sub" id="dSub"></div>
      </div>
      <button class="btn pri" id="dl">📥 Download this day as CSV</button>
    </div>

    <div class="runcard" id="runcard"></div>

    <div class="searchbar sm" style="margin-top:16px">
      <span class="si">🔍</span>
      <input id="q" type="search" autocomplete="off"
             placeholder="Search this day's catalogue — product, handle, SKU or variant…">
      <button class="clr" id="qc" hidden>✕</button>
    </div>

    <div class="tw" style="border-top:1px solid var(--border);border-radius:12px">
      <table>
        <thead><tr>
          <th>Product</th><th>Variant</th><th>Price</th><th>Compare at</th>
          <th>Discount</th><th>Last changed</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="pager">
      <span id="cnt"></span>
      <span class="grow"></span>
      <button class="btn" id="prev">← Previous</button>
      <span id="pg" class="pgn"></span>
      <button class="btn" id="next">Next →</button>
    </div>
  </div>
</div>

<script>
const ID  = new URLSearchParams(location.search).get('id') || '1'
const nf  = n => n == null ? '—' : new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(n)
const dtL = s => s ? new Date(s).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}) : '—'
const dt  = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '—'
const esc = s => String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))

let CUR = 'PKR', DATE = null, OFF = 0, Q = '', LIMIT = 100, SNAPS = []

tabReport.href = `/store.html?id=${ID}`

async function boot () {
  const s = await (await fetch(`/api/stores/${ID}`)).json()
  CUR = s.currency
  document.title = `${s.name} — History`
  nm.textContent = s.name
  av.textContent = s.name.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()
  av.style.background = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'][(s.id-1)%8]
  meta.textContent = `${s.domain} · ID ${s.id} · ${s.currency}`

  SNAPS = await (await fetch(`/api/stores/${ID}/snapshots`)).json()
  if (!SNAPS.length) {
    daylist.innerHTML = `<div class="nores"><div class="ne">📂</div>
      <div class="nt">Nothing archived yet</div>
      <div class="nd">Ingest a CSV for this store and it will appear here.</div></div>`
    return
  }
  renderDays()
  select(SNAPS[0].run_date)
}

function renderDays () {
  daylist.className = 'daylist'
  daylist.innerHTML = SNAPS.map(s => {
    const cls = { success:'ok', partial:'wrn', failed:'err', pending:'non' }[s.status] || 'non'
    return `<button class="day ${s.run_date===DATE?'on':''}" data-d="${s.run_date}">
      <div class="dd1">${dt(s.run_date)}</div>
      <div class="dd2">${nf(s.products_found)} products · ${nf(s.variants_found)} variants</div>
      <div class="st ${cls}" style="margin:9px 0 0;padding-top:8px"><span class="d"></span>${s.status}</div>
    </button>`
  }).join('')
  document.querySelectorAll('.day').forEach(b => b.onclick = () => select(b.dataset.d))
}

function select (date) {
  DATE = date; OFF = 0; Q = ''; q.value = ''; qc.hidden = true
  renderDays(); detail.hidden = false; load()
}

async function load () {
  rows.innerHTML = Array.from({length:8},()=>`<tr class="skr"><td colspan="7"><div class="skl w90"></div></td></tr>`).join('')
  const r = await (await fetch(
    `/api/stores/${ID}/snapshot?date=${DATE}&offset=${OFF}&limit=${LIMIT}${Q?`&q=${encodeURIComponent(Q)}`:''}`)).json()

  dLabel.textContent = dtL(r.date)
  dSub.textContent = `${nf(r.total_products)} products · ${nf(r.total_variants)} variants` +
                     (Q ? `  (filtered)` : '')

  const run = r.run
  runcard.innerHTML = run ? `
    <div class="rc"><span>Source file</span><b class="mono">${esc(run.file_name || '—')}</b></div>
    <div class="rc"><span>Scrape status</span><b>${run.status}</b></div>
    <div class="rc"><span>CSV rows</span><b>${nf(run.rows_ingested)}</b></div>
    <div class="rc"><span>Products in file</span><b>${nf(run.products_found)}</b></div>
    <div class="rc"><span>Variants in file</span><b>${nf(run.variants_found)}</b></div>
    <div class="rc"><span>Changes recorded</span><b>${nf(run.changes_found)}</b></div>`
    : `<div class="rc"><span>No scrape run</span><b>reconstructed from earlier data</b></div>`

  cnt.innerHTML = r.total_variants
    ? `showing <b>${r.offset+1}–${r.offset+r.shown}</b> of ${nf(r.total_variants)} variants` : ''
  pg.textContent = r.total_variants ? `page ${Math.floor(OFF/LIMIT)+1} of ${Math.max(1,Math.ceil(r.total_variants/LIMIT))}` : ''
  prev.disabled = OFF === 0
  next.disabled = OFF + r.shown >= r.total_variants

  rows.innerHTML = r.rows.length ? r.rows.map(x => `
    <tr>
      <td><div class="pcell">
        ${x.image_src ? `<img class="thumb" src="${esc(x.image_src)}" loading="lazy" alt="">` : `<div class="thumb"></div>`}
        <div style="min-width:0">
          <div class="pt">${esc(x.title||'—')}</div>
          <div class="hd">${esc(x.handle)}</div>
          ${x.sku ? `<div class="sk">SKU · ${esc(x.sku)}</div>` : ''}
        </div></div></td>
      <td>${(x.variant_label||'—').split(' / ').map(v=>`<span class="vp">${esc(v)}</span>`).join('')}</td>
      <td class="num"><span class="newp">${nf(x.price)}</span><div class="s2">${CUR}</div></td>
      <td class="num">${x.compare_at_price ? nf(x.compare_at_price) : '—'}</td>
      <td class="num">${Number(x.discount_pct) ? `<b style="color:var(--ink)">${x.discount_pct}%</b>` : '—'}</td>
      <td class="num">${dt(x.last_changed)}<div class="s2">since</div></td>
      <td><a class="lnk" href="${esc(x.product_url)}" target="_blank" rel="noopener">Open ↗</a></td>
    </tr>`).join('')
    : `<tr><td colspan="7"><div class="nores" style="border:0;background:none;padding:40px 10px">
         <div class="ne">🔍</div><div class="nt">Nothing found</div>
         <div class="nd">${Q?`No rows match “${esc(Q)}” on this date.`:'This day has no catalogue data.'}</div>
       </div></td></tr>`
}

let t
q.addEventListener('input', () => {
  Q = q.value.trim(); qc.hidden = !Q; OFF = 0
  clearTimeout(t); t = setTimeout(load, 220)
})
qc.onclick = () => { q.value=''; Q=''; qc.hidden=true; OFF=0; load(); q.focus() }
prev.onclick = () => { OFF = Math.max(0, OFF - LIMIT); load(); scrollTo({top:detail.offsetTop-20,behavior:'smooth'}) }
next.onclick = () => { OFF += LIMIT; load(); scrollTo({top:detail.offsetTop-20,behavior:'smooth'}) }
dl.onclick = () => location.href = `/api/stores/${ID}/snapshot.csv?date=${DATE}`
tg.onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark')
}

boot()
</script>
</body>
</html>
