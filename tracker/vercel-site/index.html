<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stores — Shopify Tracker</title>
<link rel="stylesheet" href="/app.css?v=46d5a2e5">
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="bl">
      <div class="logo">ST</div>
      <div>
        <div class="ttl">Store Tracker</div>
        <div class="sub" id="sub">loading…</div>
      </div>
    </div>
    <button class="btn ico" id="tg" title="Switch theme">◐</button>
  </div>
</header>

<div class="page">

  <!-- ── overview ── -->
  <div class="ovw" id="ovw"></div>

  <!-- ── search ── -->
  <div class="searchbar">
    <span class="si">🔍</span>
    <input id="search" type="search" autocomplete="off"
           placeholder="Search by store name, website or ID…   (press / )">
    <button class="clr" id="clr" title="Clear" hidden>✕</button>
  </div>

  <div class="frow" style="margin-bottom:20px">
    <button class="chip on" data-f="all">All stores</button>
    <button class="chip"    data-f="today">Updated today</button>
    <button class="chip"    data-f="changes">Has changes</button>
    <button class="chip"    data-f="issue">Needs attention</button>
    <button class="chip" id="showMuted" title="Warnings you have dismissed">Show dismissed</button>
    <span class="grow"></span>
    <label class="sortl">Sort
      <select id="sort" class="sel">
        <option value="id">Store ID</option>
        <option value="name">Name</option>
        <option value="products">Most products</option>
        <option value="changes">Most changes</option>
      </select>
    </label>
  </div>

  <div id="hint" class="rescount"></div>
  <div id="gridwrap" class="gridwrap"><div id="grid" class="grid"></div></div>
  <div id="more" class="morebar" hidden></div>

</div>

<script>
const nf   = n => new Intl.NumberFormat('en-US').format(n ?? 0)
const dt   = s => s ? new Date(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) : '—'
const HUES = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948']
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()

let STORES = [], filter = 'all', sort = 'id', term = ''

const isToday = s => s.last_run && s.last_run === STORES.map(x=>x.last_run).sort().at(-1)
/** Newest run date across every store. Staleness is measured against the fleet,
 *  not against today: if the whole pipeline pauses for a weekend, no store is
 *  individually at fault, but one store falling behind the rest always is. */
let LATEST = null
let showMuted = false
const DAY = 86400000
const daysBehind = s => (LATEST && s.last_run)
  ? Math.round((Date.parse(LATEST) - Date.parse(s.last_run)) / DAY) : 0

/** A run that succeeded three days ago is not a healthy store — it is a store
 *  that stopped reporting. That reads as 'ok' if only last_status is checked. */
/** Dismissed warnings are still true, they are just no longer news. Showing
 *  them keeps the list permanently non-empty, and a counter that never reaches
 *  zero stops being read at all. `showMuted` brings them back. */
const muted = (s, kind) => !showMuted && (s.muted || []).includes(kind)

const health = s => !s.last_run ? 'non'
                  : (daysBehind(s) >= 2 && !muted(s, 'stale')) ? 'stale'
                  : s.last_status === 'success' ? 'ok'
                  : s.last_status === 'partial' ? (muted(s, 'partial') ? 'ok' : 'wrn')
                  : muted(s, 'failed') ? 'ok' : 'err'

/** Why a run came back partial. The ingest suppresses removals when a file
 *  holds less than half of what is stored — that is a scrape that fell short,
 *  not a store that lost its catalogue overnight, and the card said neither.
 *  Clothesmentor lands here every day: Shopify stops paging at 25,000, so a
 *  122,000-product store can never send more than a fifth of itself. */
function shortfall (s) {
  const f = s.last_file_products
  if (f == null || !s.products) return ''
  return ` · file had ${nf(f)} of ${nf(s.products)} products, removals skipped`
}

/** Which warning a card is showing, so it can be muted by kind. */
const alertKind = s => ({ stale:'stale', wrn:'partial', err:'failed' })[health(s)] || null

/**
 * What to actually do about the warning. Written per cause, because the causes
 * need opposite responses: one is a Shopify limit nobody can lift, another is a
 * store that genuinely shrank, a third is a scraper that stopped getting in.
 */
function alertHint (s) {
  const k = alertKind(s)
  if (k === 'stale') {
    return `Check the scraper's log for this store — a store answering HTTP 403 is
            blocked at its firewall, not broken here. If it has closed, remove it from the sheet.`
  }
  if (k === 'partial') {
    const f = s.last_file_products
    // Shopify refuses page x limit past 25,000, so a bigger catalogue can never
    // arrive whole. That is a fact about the feed, not a fault to chase.
    if (f != null && f >= 24000 && s.products > 25000) {
      return `Shopify stops paging at 25,000, and this catalogue is larger — the full list
              can never arrive. Nothing to fix; dismiss this one.`
    }
    return `The file came back with less than half of what is stored, so removals were
            skipped for safety. Re-run today's scrape for this store; if it stays short,
            the store really did shrink and the next full file will settle it.`
  }
  if (k === 'failed') {
    return `The scrape did not finish. Check the ingest log for this store's file — an
            oversized or malformed CSV is the usual cause.`
  }
  return ''
}

function statusRow (s) {
  const h = health(s), lbl = dt(s.last_run)
  const d = daysBehind(s)
  const txt = { ok:`Updated ${lbl}`, wrn:`Partial — ${lbl}${shortfall(s)}`,
                err:`Scrape failed — ${lbl}`, non:'Never scraped',
                // Deliberately not "closed": outlet-shoes.ro stopped because a
                // firewall started answering 403, and the shop is still trading.
                stale:`No data since ${lbl} (${d} day${d===1?'':'s'}) — may be blocked or gone`
              }[h]
  return `<div class="st ${h}"><span class="d"></span>${txt}</div>`
}

function matches (s) {
  if (filter === 'today'   && !isToday(s))                     return false
  if (filter === 'changes' && !s.last_changes)                 return false
  if (filter === 'issue'   && ['ok'].includes(health(s)))      return false
  if (!term) return true
  const t = term.toLowerCase()
  return String(s.id) === t || s.name.toLowerCase().includes(t) ||
         s.domain.toLowerCase().includes(t) || (s.country||'').toLowerCase() === t
}

function hilite (text, t) {
  if (!t) return text
  const i = text.toLowerCase().indexOf(t.toLowerCase())
  return i < 0 ? text
    : text.slice(0,i) + '<mark>' + text.slice(i, i+t.length) + '</mark>' + text.slice(i+t.length)
}

/** 242 cards made the page itself the scrollbar. The grid scrolls inside a
 *  fixed box and shows exactly 50 at a time — the rest are a page away, not a
 *  scroll away, so the box never grows and the count on screen never changes. */
const PAGE = 50
let page = 0, LIST = []

function render (keepPage) {
  if (!keepPage) page = 0
  let list = STORES.filter(matches)
  const by = { id:(a,b)=>a.id-b.id, name:(a,b)=>a.name.localeCompare(b.name),
               products:(a,b)=>b.products-a.products, changes:(a,b)=>b.last_changes-a.last_changes }
  list.sort(by[sort])

  document.getElementById('hint').innerHTML = (term || filter !== 'all')
    ? `<b>${list.length}</b> of ${STORES.length} store${STORES.length===1?'':'s'}` +
      (term ? ` matching “${term}”` : '') : ''

  if (!list.length) {
    document.getElementById('grid').className = ''
    document.getElementById('grid').innerHTML = `
      <div class="nores">
        <div class="ne">🔍</div>
        <div class="nt">No stores found</div>
        <div class="nd">${term ? `Nothing matches “${term}”.` : 'No stores match this filter.'}
          Try a different search, or <button class="linkbtn" id="rst">reset filters</button>.</div>
      </div>`
    document.getElementById('rst').onclick = () => {
      term = ''; filter = 'all'
      document.getElementById('search').value = ''
      document.getElementById('clr').hidden = true
      document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f==='all'))
      render()
    }
    return
  }

  LIST = list
  const pages = Math.max(1, Math.ceil(list.length / PAGE))
  if (page > pages - 1) page = pages - 1
  const from = page * PAGE
  document.getElementById('grid').className = 'grid'
  document.getElementById('grid').innerHTML = list.slice(from, from + PAGE).map((s,i) => {
    const hue = HUES[(s.id - 1) % HUES.length]
    return `
    <a class="card" href="/store.html?id=${s.id}" style="animation-delay:${Math.min(i,12)*22}ms">
      <div class="chead">
        <div class="av" style="background:${hue}">${initials(s.name)}</div>
        <div style="min-width:0;flex:1">
          <div class="nm">${hilite(s.name, term)}</div>
          <div class="dm">${hilite(s.domain, term)}</div>
        </div>
        <span class="idb">ID ${s.id}</span>
      </div>

      <div class="stats">
        <div><div class="sv">${nf(s.products)}</div><div class="sl">Products</div></div>
        <div><div class="sv">${nf(s.variants)}</div><div class="sl">Variants</div></div>
        <div><div class="sv ${s.last_changes?'hot':''}">${nf(s.last_changes)}</div><div class="sl">Changes</div></div>
      </div>

      <div class="meta2">
        <span class="tagx">${s.currency}</span>
        ${s.country ? `<span class="tagx">${s.country}</span>` : ''}
        <span class="tagx">${s.runs} scrape${s.runs===1?'':'s'}</span>
      </div>

      ${statusRow(s)}
      ${alertKind(s) ? `
        <div class="fixit">
          <div class="fixhint">${alertHint(s).replace(/\s+/g, ' ').trim()}</div>
          <button class="btn sm dismiss${(s.muted||[]).includes(alertKind(s)) ? ' undo' : ''}"
                  data-id="${s.id}" data-kind="${alertKind(s)}">
            ${(s.muted||[]).includes(alertKind(s)) ? 'Restore this warning' : 'Dismiss this warning'}
          </button>
        </div>` : ''}
      <div class="cta">View report →</div>
    </a>`
  }).join('')

  const bar = document.getElementById('more')
  bar.hidden = list.length <= PAGE
  bar.innerHTML = `
    <button class="btn" id="pprev"${page === 0 ? ' disabled' : ''}>← Previous</button>
    <span class="pgc">${nf(from + 1)}–${nf(Math.min(from + PAGE, list.length))} of ${nf(list.length)} stores
      <i>page ${page + 1} of ${pages}</i></span>
    <button class="btn" id="pnext"${page >= pages - 1 ? ' disabled' : ''}>Next →</button>`
  document.getElementById('pprev').onclick = () => turn(-1)
  document.getElementById('pnext').onclick = () => turn(1)
}

/** Back to the top of the box on every turn: landing mid-list after a page
 *  change reads as nothing having happened. */
function turn (d) {
  page += d
  render(true)
  document.getElementById('gridwrap').scrollTop = 0
}

function overview () {
  const p = STORES.reduce((a,s)=>a+s.products,0)
  const v = STORES.reduce((a,s)=>a+s.variants,0)
  const c = STORES.reduce((a,s)=>a+s.last_changes,0)
  const bad = STORES.filter(s => health(s) !== 'ok').length
  document.getElementById('ovw').innerHTML = `
    <div class="ov"><div class="ok">${nf(STORES.length)}</div><div class="ol">Stores tracked</div></div>
    <div class="ov"><div class="ok">${nf(p)}</div><div class="ol">Products</div></div>
    <div class="ov"><div class="ok">${nf(v)}</div><div class="ol">Variants</div></div>
    <div class="ov"><div class="ok" style="color:var(--blue)">${nf(c)}</div><div class="ol">Changes last run</div></div>
    <div class="ov"><div class="ok" style="color:${bad?'var(--critical)':'var(--good-ink)'}">${bad}</div>
      <div class="ol">Need attention</div></div>`
}

// ── wiring ────────────────────────────────────────────────────────
const $s = document.getElementById('search'), $c = document.getElementById('clr')
$s.addEventListener('input', () => { term = $s.value.trim(); $c.hidden = !term; render() })
$c.onclick = () => { $s.value=''; term=''; $c.hidden=true; render(); $s.focus() }
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== $s) { e.preventDefault(); $s.focus() }
  if (e.key === 'Escape' && document.activeElement === $s) { $s.value=''; term=''; $c.hidden=true; render() }
})
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => {
  filter = b.dataset.f
  document.querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x===b))
  render()
})
document.getElementById('sort').onchange = e => { sort = e.target.value; render() }

// The card is one big link, so the button has to stop the click reaching it.
document.getElementById('grid').addEventListener('click', async e => {
  const b = e.target.closest('.dismiss')
  if (!b) return
  e.preventDefault(); e.stopPropagation()
  const { id, kind } = b.dataset
  const on = b.classList.contains('undo')
  b.disabled = true
  b.textContent = on ? 'Restoring…' : 'Dismissing…'
  try {
    const r = await fetch(`/api/stores/${id}/mute?kind=${kind}`, { method: on ? 'DELETE' : 'POST' })
    if (!r.ok) throw new Error(`HTTP ${r.status}`)
    const s = STORES.find(x => String(x.id) === String(id))
    s.muted = on ? (s.muted || []).filter(k => k !== kind) : [...(s.muted || []), kind]
    overview(); render(true)
  } catch (err) {
    b.disabled = false
    b.textContent = 'Could not save — try again'
  }
})

document.getElementById('showMuted').onclick = e => {
  showMuted = !showMuted
  e.currentTarget.classList.toggle('on', showMuted)
  e.currentTarget.textContent = showMuted ? 'Hide dismissed' : 'Show dismissed'
  overview(); render()
}
document.getElementById('tg').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme')
    || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark')
}

document.getElementById('grid').innerHTML =
  Array.from({length:3},()=>'<div class="card sk"><div class="skl w60"></div><div class="skl w40"></div><div class="skl w90" style="margin-top:18px;height:34px"></div></div>').join('')

fetch('/api/stores').then(r => r.json()).then(rows => {
  STORES = rows
  LATEST = rows.map(r => r.last_run).filter(Boolean).sort().at(-1) || null
  document.getElementById('sub').textContent =
    `${rows.length} store${rows.length===1?'':'s'} · updated ${dt(rows.map(r=>r.last_run).sort().at(-1))}`
  overview(); render()
}).catch(e => {
  document.getElementById('grid').className = ''
  document.getElementById('grid').innerHTML =
    `<div class="nores"><div class="ne">⚠</div><div class="nt">Could not load stores</div>
     <div class="nd">${e.message}</div></div>`
})
</script>
</body>
</html>
